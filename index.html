<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17152d" />
  <title>MonsterWorld</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="portada" aria-live="polite">
  <div class="loading-content">
    <div id="loadingCopy" class="loading-copy">Despertando monstruos...</div>
    <div class="loading-bar">
      <div id="barraCarga" class="loading-bar-fill"></div>
    </div>
  </div>
</div>
    <div id="app">
    <header class="topbar">...</header>

    <section class="profile-panel">...</section>

    <div id="starterEggHolder"></div>

    <main>
      ...
    </main>
  </div>
          <h1>MonsterWorld</h1>
          <small>Tu mundo mágico</small>
        </div>
      </div>

      <button class="wallet-button" id="walletButton" type="button">
        <span class="wallet-label">💎 BILLETERA</span>
        <span class="wallet-balance">🪙 <span id="coins">100</span></span>
      </button>
    </header>

    <section class="profile-panel">
      <div>
        <div class="level">⭐ NIVEL <span id="playerLevel">1</span></div>
        <small>Entrenador de monstruos</small>
      </div>
      <div class="profile-summary">
        <strong id="slotCounter">1 / 1</strong>
        <small>Espacios ocupados</small>
      </div>
    </section>

    <main>
      <section id="page-monstruos">
        <div class="page-title">
          <h2>Mis monstruos 👾</h2>
          <p>Cuida, alimenta y haz crecer tus criaturas.</p>
        </div>
        <div id="collection" class="monster-grid"></div>
      </section>

      <section id="page-tienda" class="hidden">
        <h2>Tienda</h2>
        <div id="shop"></div>
      </section>
    </main>

    <div id="notice" class="notice"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
