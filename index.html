
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonsterWorld</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10152b;color:white;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#202b50;text-align:center}
h1{margin:0;color:#91f7b5;font-size:29px}
header p{margin-bottom:0;color:#d2dcff}
main{max-width:440px;margin:auto;padding:18px}
.coins{background:#28375b;padding:14px;border-radius:14px;text-align:center;font-size:20px}
.monster{margin-top:18px;background:linear-gradient(145deg,#493c83,#202d53);padding:24px 15px;border-radius:22px;text-align:center}
.pet{font-size:100px;margin:15px}
h2{margin:8px}
.level{color:#b7ffce}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#8af0ad;color:#17213a;font-weight:bold;font-size:16px}
button:active{transform:scale(.98)}
.secondary{background:#f4d477}
.section{margin-top:22px;background:#1c2543;padding:16px;border-radius:16px}
.small{color:#c8d2f0;font-size:14px}
</style>
</head>
<body>
<header>
<h1>🌍 MonsterWorld</h1>
<p>¡Tu aventura comienza aquí!</p>
</header>
<main>
<div class="coins">🪙 Monedas: <strong id="coins">100</strong></div>
<div class="monster">
<div class="pet" id="pet">👾</div>
<h2 id="name">Bubu</h2>
<p class="level">⭐ Nivel 1</p>
<p id="mood">Bubu está esperando jugar contigo.</p>
<button onclick="care()">🍎 Cuidar monstruo</button>
<button class="secondary" onclick="play()">🎮 Jugar con Bubu</button>
</div>
<div class="section">
<h2>🐣 Mi colección</h2>
<p>👾 Bubu — Tu primer monstruo</p>
<p class="small">¡Cuida a tu monstruo para comenzar tu aventura!</p>
</div>
<div class="section">
<h2>🎁 Recompensa diaria</h2>
<p class="small" id="daily">Puedes recoger tu recompensa una vez al día.</p>
<button onclick="dailyReward()">🎁 Reclamar 20 monedas</button>
</div>
</main>
<script>
let coins=100;
function update(){document.getElementById('coins').textContent=coins}
function care(){
if(coins>=5){coins-=5;update();document.getElementById('mood').textContent='❤️ ¡Bubu está feliz! Lo has cuidado.'}
else{document.getElementById('mood').textContent='Necesitas más monedas.'}
}
function play(){
document.getElementById('mood').textContent='🎉 ¡Bubu se divierte contigo!';
}
function dailyReward(){
let today=new Date().toLocaleDateString();
if(localStorage.getItem('mw_daily')===today){
document.getElementById('daily').textContent='Ya recogiste tu recompensa hoy. ¡Vuelve mañana!';
return;
}
coins+=20;update();localStorage.setItem('mw_daily',today);
document.getElementById('daily').textContent='¡Recibiste 20 monedas! Vuelve mañana.';
}
</script>
</body>
</html>
